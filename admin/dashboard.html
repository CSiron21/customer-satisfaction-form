<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Holy Angel University</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="../css/dashboard.css">
    <meta name="description" content="Admin Dashboard for Holy Angel University Customer Satisfaction Survey">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="dashboard-nav">
        <div class="nav-brand">
            <img src="../images/HAU.png" alt="HAU Logo" class="nav-logo">
            <div class="nav-title-group">
                <span class="nav-title">Holy Angel University</span>
                <span class="nav-subtitle">Customer Satisfaction Dashboard</span>
            </div>
        </div>
        <div class="nav-actions">
            <span class="nav-user">
                <i class="fas fa-user-shield"></i>
                <span id="nav-username"></span>
            </span>
            <a href="#" class="nav-logout" title="Sign Out" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="dashboard-container">
        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card card-total">
                <div class="card-icon">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <div class="card-info">
                    <div class="card-number" id="count-total">0</div>
                    <div class="card-label">Total Submissions</div>
                </div>
            </div>
            <div class="summary-card card-satisfied">
                <div class="card-icon">
                    <i class="fas fa-smile"></i>
                </div>
                <div class="card-info">
                    <div class="card-number" id="count-satisfied">0</div>
                    <div class="card-label">Satisfied</div>
                </div>
            </div>
            <div class="summary-card card-not-satisfied">
                <div class="card-icon">
                    <i class="fas fa-frown"></i>
                </div>
                <div class="card-info">
                    <div class="card-number" id="count-not-satisfied">0</div>
                    <div class="card-label">Not Satisfied</div>
                </div>
            </div>
        </div>

        <!-- Submissions Table -->
        <div class="table-wrapper">
            <div class="table-header">
                <h2 class="table-title">
                    <i class="fas fa-table me-2"></i>All Submissions
                </h2>
                <div class="table-controls">
                    <label for="entries-select">Show</label>
                    <select id="entries-select" class="entries-select">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    <label>entries</label>
                </div>
            </div>

            <div id="table-content">
                <!-- Populated by JS -->
            </div>

            <div class="table-footer" id="table-footer" style="display: none;">
                <div class="pagination-info" id="pagination-info"></div>
                <div class="pagination-controls" id="pagination-controls"></div>
            </div>
        </div>
    </div>

    <!-- Submission Details Modal -->
    <div class="modal fade" id="submissionModal" tabindex="-1" aria-labelledby="submissionModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-light">
                    <h5 class="modal-title" id="submissionModalLabel">
                        <i class="fas fa-file-alt me-2 text-muted"></i>Submission #<span id="modal-id"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h6 class="text-muted mb-0">Satisfaction Rating</h6>
                        <span id="modal-satisfaction" class="badge rounded-pill"></span>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="small text-muted text-uppercase fw-bold">Name</label>
                            <p id="modal-name" class="fw-medium text-dark mb-0 text-break"></p>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-muted text-uppercase fw-bold">Category</label>
                            <p id="modal-category" class="fw-medium text-dark mb-0"></p>
                        </div>
                        <div class="col-12">
                            <label class="small text-muted text-uppercase fw-bold">Service / Purpose</label>
                            <p id="modal-service" class="fw-medium text-dark mb-0 pb-2 border-bottom text-break"></p>
                        </div>
                        <div class="col-12">
                            <label class="small text-muted text-uppercase fw-bold mt-2">Comments</label>
                            <div class="p-3 bg-light rounded-3">
                                <p id="modal-comments" class="mb-0 text-secondary fst-italic text-break"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light justify-content-between">
                    <small class="text-muted">
                        <i class="far fa-clock me-1"></i> Submitted: <span id="modal-date" class="fw-semibold"></span>
                    </small>
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Modules -->
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>

</html>
